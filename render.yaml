services:
  - type: web
    name: placementpro
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb+srv://<username>:<password>@cluster.mongodb.net/placementpro
      - key: MONGODB_DB_NAME
        value: placementpro
